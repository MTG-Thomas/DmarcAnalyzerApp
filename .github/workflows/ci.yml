# CI: test everything on every push/PR, and build the container image.
#
# Release channels — `latest` tracks releases, never bleeding-edge `main`, because
# the README quick-start pulls `latest` and a fresh install must be reproducible:
#
#   tag vX.Y.Z    ->  latest, X.Y.Z, X.Y, sha-<commit>   (the stable channel)
#   push main     ->  edge, sha-<commit>                 (tracks development)
#   pull request  ->  build only, never pushed           (proves the Dockerfile)
#   manual        ->  same as a push, run against any ref (catch-up / retry)
#
# Documentation-only pushes to `main` skip the image entirely. Release tags and
# pull requests always build it, so a doc filter can never suppress a release or
# hide a broken Dockerfile.
#
# The manual trigger exists for exactly one situation: a push landed (the commit
# is on `main`) but nothing built for it — a throttled webhook during a GitHub
# Actions incident, most likely, since that class of event is the one push
# triggers don't automatically replay. `gh workflow run ci.yml --ref main`
# reruns the same `changes`/`image` logic against current HEAD without needing
# a new commit, which matters here because `main` is protected against direct
# pushes.
#
# The published image is the single-image runtime (APP_MODE=api|worker) that the
# README quick-start and the marketing site's "Get started" flow point at.
#
# Two registries, one build:
#   ghcr.io/dmarc-analyzer-net/dmarc-analyzer  — canonical (no pull rate limits,
#                                                zero setup, what the README uses)
#   dmarcanalyzernet/dmarc-analyzer            — Docker Hub mirror for discovery
#
# The Docker Hub push is skipped automatically unless DOCKERHUB_TOKEN is set as a
# repository secret, so this workflow works as-is.
name: CI

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/dmarc-analyzer
  DOCKERHUB_IMAGE: dmarcanalyzernet/dmarc-analyzer
  CHART_REGISTRY: oci://ghcr.io/${{ github.repository_owner }}/charts
  CHART_DIR: deploy/helm/dmarc-analyzer

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json

      - name: Restore locked dependencies
        run: dotnet restore DmarcAnalyzerApp.slnx --locked-mode --nologo

      - name: Build with analyzers and warnings as errors
        run: dotnet build DmarcAnalyzerApp.slnx --configuration Release --no-restore --nologo -warnaserror

      - name: API tests with coverage
        run: dotnet test src/api.tests/DmarcAnalyzer.Api.Tests.csproj --configuration Release --no-build --nologo --collect:"XPlat Code Coverage" --results-directory "$GITHUB_WORKSPACE/TestResults"

      - name: Preserve coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: api-coverage
          path: TestResults/**/coverage.cobertura.xml
          if-no-files-found: error
          retention-days: 14

      - name: Upload coverage to Codecov
        if: vars.CODECOV_ENABLED == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          use_oidc: true
          directory: TestResults
          fail_ci_if_error: true

      - name: Note pending Codecov onboarding
        if: vars.CODECOV_ENABLED != 'true'
        run: echo "::warning::Coverage is preserved as api-coverage. Onboard this fork in Codecov, then set CODECOV_ENABLED=true to activate the fail-closed upload."

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/web/package-lock.json

      - name: Frontend audit + lint + type-check + test + build
        working-directory: src/web
        run: |
          npm ci
          npm audit --audit-level=high
          npm run lint
          npx tsc --noEmit
          npm test
          npm run build

  postgres-integration:
    name: PostgreSQL 16 integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: dmarc-${{ github.run_id }}-${{ github.run_attempt }}-pg16
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json

      - name: Prepare masked test connection
        shell: bash
        run: |
          connection="Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=dmarc-${{ github.run_id }}-${{ github.run_attempt }}-pg16"
          echo "::add-mask::$connection"
          echo "DMARC_TEST_POSTGRES=$connection" >> "$GITHUB_ENV"

      - name: PostgreSQL integration tests
        run: dotnet test src/api.integrationtests/DmarcAnalyzer.Api.IntegrationTests.csproj --configuration Release --nologo

  postgres-18-migration-smoke:
    name: PostgreSQL 18 migration smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: dmarc-${{ github.run_id }}-${{ github.run_attempt }}-pg18
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json

      - name: Prepare masked test connection
        shell: bash
        run: |
          connection="Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=dmarc-${{ github.run_id }}-${{ github.run_attempt }}-pg18"
          echo "::add-mask::$connection"
          echo "DMARC_TEST_POSTGRES=$connection" >> "$GITHUB_ENV"

      - name: PostgreSQL migration tests
        run: dotnet test src/api.integrationtests/DmarcAnalyzer.Api.IntegrationTests.csproj --configuration Release --nologo --filter Category=Migration


  # The chart is checked on every run and published only on a release tag. The
  # checks matter more than the publish: a chart is templating, so nothing but
  # rendering it proves it still works, and a broken one fails at `helm install`
  # in someone else's cluster rather than here.
  chart:
    needs: [test, postgres-integration, postgres-18-migration-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release tag provenance
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          [ "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" = tag ] || {
            echo "::error::$GITHUB_REF_NAME must be an annotated tag."
            exit 1
          }
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::$GITHUB_REF_NAME does not point to a commit reachable from main."
            exit 1
          }

      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1

      # A syntactically valid throwaway key. It has to be real base64 for 32 bytes:
      # values.schema.json checks the shape, so a placeholder like "dummy" fails
      # lint — and worse, would make the guardrail checks below pass because the
      # schema rejected the key rather than because the guardrail fired.
      - name: Lint
        env:
          DUMMY_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
        run: helm lint "$CHART_DIR" --set auth.encryptionKey="$DUMMY_KEY"

      # Every supported combination, because they do not share a code path: the
      # migration Job renders only without bundled Postgres, and the worker
      # Deployment only in split mode. A single render would have shipped a Job
      # that could never create a pod.
      - name: Render every supported combination
        env:
          DUMMY_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
        run: |
          set -euo pipefail
          fail=0
          render() {
            local label="$1"; shift
            if out=$(helm template t "$CHART_DIR" --set auth.encryptionKey="$DUMMY_KEY" "$@" 2>&1); then
              printf '  ok       %s (%s resources)\n' "$label" "$(printf '%s' "$out" | grep -c '^kind:')"
            else
              printf '  FAILED   %s\n%s\n' "$label" "$out"; fail=1
            fi
          }
          render "bundled + combined"
          render "bundled + split"   --set mode=split
          render "external + combined" --set postgres.enabled=false --set externalDatabase.host=db.example
          render "external + split"    --set postgres.enabled=false --set externalDatabase.host=db.example --set mode=split
          render "ingress enabled"     --set ingress.enabled=true
          render "existingSecret"      --set auth.existingSecret=creds

          # A digest must reach every application-image consumer: the app,
          # worker, migration Job and their database-wait init containers. Set a
          # test repository so this assertion cannot accidentally match the
          # bundled Postgres image.
          test_repository=registry.example/dmarc-analyzer
          test_digest=sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          digest_render=$(helm template t "$CHART_DIR" \
            --set auth.encryptionKey="$DUMMY_KEY" \
            --set postgres.enabled=false \
            --set externalDatabase.host=db.example \
            --set mode=split \
            --set image.repository="$test_repository" \
            --set-string image.digest="$test_digest")
          digest_refs=$(printf '%s\n' "$digest_render" | grep -cF "image: $test_repository@$test_digest" || true)
          other_refs=$(printf '%s\n' "$digest_render" | grep -F "image: $test_repository" | grep -vcF "@$test_digest" || true)
          if [ "$digest_refs" -eq 0 ] || [ "$other_refs" -ne 0 ]; then
            printf '  FAILED   digest image references (%s digest, %s other)\n' "$digest_refs" "$other_refs"
            fail=1
          else
            printf '  ok       digest image references (%s immutable references)\n' "$digest_refs"
          fi
          exit $fail

      # The guardrails are the chart's main safety feature, so a change that
      # quietly stops them refusing has to fail here rather than be discovered by
      # someone running two schedulers against one mailbox.
      - name: Guardrails must refuse
        env:
          DUMMY_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
        run: |
          set -euo pipefail
          fail=0
          refuses() {
            local label="$1"; shift
            if helm template t "$CHART_DIR" "$@" >/dev/null 2>&1; then
              printf '  NOT REFUSED  %s\n' "$label"; fail=1
            else
              printf '  refused      %s\n' "$label"
            fi
          }
          refuses "combined with 2 app replicas" --set auth.encryptionKey="$DUMMY_KEY" --set app.replicas=2
          refuses "worker.replicas=2"            --set auth.encryptionKey="$DUMMY_KEY" --set mode=split --set worker.replicas=2
          refuses "startup migrations, 3 app replicas" --set auth.encryptionKey="$DUMMY_KEY" --set mode=split --set app.replicas=3 --set migrations.strategy=startup
          refuses "external db without a host"   --set auth.encryptionKey="$DUMMY_KEY" --set postgres.enabled=false
          refuses "no encryption key"            --set mode=combined
          refuses "unknown mode"                 --set auth.encryptionKey="$DUMMY_KEY" --set mode=hybrid
          refuses "image tag plus digest"         --set auth.encryptionKey="$DUMMY_KEY" --set image.tag=0.10.0 --set-string image.digest=sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          refuses "malformed image digest"        --set auth.encryptionKey="$DUMMY_KEY" --set-string image.digest=sha256:not-a-digest
          exit $fail

      # VersionReferenceTests checks the tracked files against Chart.yaml, so it
      # catches drift *between* files and not a Chart.yaml left on the previous
      # release — forget the bump and everything stays consistently stale while
      # CI stays green. That is how v0.8.0 shipped with 0.7.1 still committed.
      # The published chart is fine either way (its version comes from the tag
      # below); what breaks is `helm install ./deploy/helm/dmarc-analyzer` from a
      # clone, which deploys the previous release, and render.yaml, which never
      # updates again. Only a tag knows the intended version, so the check lives
      # here rather than in the test suite.
      - name: Chart.yaml matches the tag
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          for key in version appVersion; do
            got=$(grep -oPm1 "^${key}:\s*\"?\K[0-9]+\.[0-9]+\.[0-9]+" "$CHART_DIR/Chart.yaml")
            [ "$got" = "$version" ] || {
              echo "::error::$CHART_DIR/Chart.yaml $key is $got, but the tag is $version."
              echo "::error::Bump it (and render.yaml) and cut a patch release; see docs/ops/release.md."
              exit 1
            }
          done
          echo "Chart.yaml version and appVersion are both $version."

  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      image: ${{ steps.decide.outputs.image }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Decide whether an image is needed
        id: decide
        run: |
          # A release tag must always produce an image, and a pull request must
          # always prove the Dockerfile still builds — never filter those.
          if [ "${{ github.ref_type }}" = "tag" ] || [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "image=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # For a push to main, build only when something outside documentation
          # changed. If the diff can't be computed, err toward building.
          #
          # Counted with a positive pattern rather than `grep -qv`: the exit-code
          # semantics of -q combined with -v differ between grep implementations,
          # and this comparison behaves identically everywhere.
          changed="$(git diff --name-only HEAD^ HEAD 2>/dev/null || true)"
          total=$(printf '%s\n' "$changed" | grep -c . || true)
          docs=$(printf '%s\n' "$changed" | grep -cE '^(docs/|LICENSE\.txt$|.*\.md$)' || true)
          echo "changed=$total docs=$docs"
          if [ "${total:-0}" -eq 0 ] || [ "${docs:-0}" -lt "${total:-0}" ]; then
            echo "image=true" >> "$GITHUB_OUTPUT"
          else
            echo "image=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Documentation-only change — skipping the container image."
          fi

  image:
    needs: [test, postgres-integration, postgres-18-migration-smoke, changes]
    if: needs.changes.outputs.image == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up QEMU (arm64 builds)
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker Hub is optional: mirror there only once the token exists, so the
      # workflow never fails on a repo that hasn't set it up. Only the token is a
      # secret — the account name comes from the DOCKERHUB_USERNAME repository
      # *variable*, falling back to the namespace owner in DOCKERHUB_IMAGE.
      - name: Check for Docker Hub credentials
        id: dockerhub
        if: github.event_name != 'pull_request'
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::DOCKERHUB_TOKEN not set — publishing to GHCR only."
          fi

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request' && steps.dockerhub.outputs.enabled == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME || 'dmarcanalyzernet' }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image metadata (tags + OCI labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          # On a pull request the Docker Hub step is skipped, so its output is
          # empty — fall back to false rather than emitting an invalid enable=.
          images: |
            name=${{ env.IMAGE }}
            name=${{ env.DOCKERHUB_IMAGE }},enable=${{ steps.dockerhub.outputs.enabled || 'false' }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=edge,enable={{is_default_branch}}
            type=raw,value=ci-smoke,enable=${{ github.event_name == 'pull_request' }}
            type=sha,prefix=sha-

      - name: Resolve canonical image name
        id: image-name
        run: echo "name=$(printf '%s' "$IMAGE" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      # The commit the image reports as its own, and the thing that lets someone on
      # a mutable tag identify their build: the version reads "0.9.0" for a release
      # and "0.9.0+a1b2c3d" for an `edge` image built past it. A release is left
      # unstamped on purpose — the tag already pins its commit, so the number in the
      # sidebar stays the number on the releases page.
      #
      # Deliberately a shell step rather than `${{ cond && '' || sha }}`. An empty
      # string is falsy in an Actions expression, so that form falls through its
      # `||` and stamps a tag build after all — silently, because both branches
      # produce a working image and only the version string differs. This is not a
      # second source of the version itself; that stays in Directory.Build.props,
      # which the release tooling bumps with the chart.
      - name: Resolve the commit to stamp
        id: stamp
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE:-}" = tag ]; then
            echo "revision=" >> "$GITHUB_OUTPUT"
            echo "Release build — no commit stamped; the tag pins it."
          else
            echo "revision=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            echo "Pre-release build — stamping $GITHUB_SHA."
          fi

      # One build, pushed to every tag metadata-action produced — which spans both
      # registries when Docker Hub is enabled. Pull requests build without pushing.
      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          load: ${{ github.event_name == 'pull_request' }}
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            SOURCE_REVISION=${{ steps.stamp.outputs.revision }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the built image
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          image=$(printf '%s' "$IMAGE" | tr '[:upper:]' '[:lower:]')
          if [ "${{ github.event_name }}" = pull_request ]; then
            image_ref="$image:ci-smoke"
          else
            image_ref="$image@$IMAGE_DIGEST"
          fi
          network=dmarc-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}
          database=dmarc-smoke-db-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}
          app=dmarc-smoke-app-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}
          password=dmarc-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-smoke
          docker network create "$network"
          docker run -d --name "$database" --network "$network" \
            -e POSTGRES_PASSWORD="$password" postgres:18-alpine
          for attempt in $(seq 1 30); do
            docker exec "$database" pg_isready -U postgres -d postgres && break
            [ "$attempt" -lt 30 ] || { docker logs "$database"; exit 1; }
            sleep 2
          done
          docker run -d --name "$app" --network "$network" -p 18080:8080 \
            -e APP_MODE=all \
            -e Database__MigrateOnStartup=true \
            -e "ConnectionStrings__Default=Host=$database;Port=5432;Database=postgres;Username=postgres;Password=$password" \
            -e Security__CredentialEncryptionKey=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA= \
            "$image_ref"
          for attempt in $(seq 1 60); do
            response=$(curl -fsS http://localhost:18080/api/v1/auth/setup 2>/dev/null || true)
            [ "$response" = '{"requiresBootstrap":true}' ] && exit 0
            [ "$attempt" -lt 60 ] || { docker logs "$app"; exit 1; }
            sleep 2
          done

      - name: Clean up smoke containers
        if: always()
        run: |
          docker rm -f "dmarc-smoke-app-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" "dmarc-smoke-db-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" 2>/dev/null || true
          docker network rm "dmarc-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" 2>/dev/null || true

      - name: Create a disposable Kubernetes cluster
        if: github.event_name == 'pull_request'
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          cluster_name: dmarc-smoke
          wait: 90s

      - name: Set up Helm
        if: github.event_name == 'pull_request'
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1

      - name: Install and probe the chart
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          image=$(printf '%s' "$IMAGE" | tr '[:upper:]' '[:lower:]')
          kind load docker-image "$image:ci-smoke" --name dmarc-smoke
          helm install smoke "$CHART_DIR" \
            --wait --timeout 5m \
            --set auth.encryptionKey=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA= \
            --set image.repository="$image" \
            --set image.tag=ci-smoke \
            --set image.pullPolicy=Never
          kubectl port-forward service/smoke-dmarc-analyzer 18081:8080 >/tmp/dmarc-port-forward.log 2>&1 &
          forward_pid=$!
          trap 'kill "$forward_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            response=$(curl -fsS http://localhost:18081/api/v1/auth/setup 2>/dev/null || true)
            [ "$response" = '{"requiresBootstrap":true}' ] && exit 0
            [ "$attempt" -lt 30 ] || {
              cat /tmp/dmarc-port-forward.log
              kubectl get all -n default
              kubectl logs deployment/smoke-dmarc-analyzer --all-containers --tail=200
              exit 1
            }
            sleep 2
          done

      - name: Generate image SBOM
        if: github.event_name != 'pull_request'
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ steps.image-name.outputs.name }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: image.spdx.json
          upload-artifact: false

      - name: Attest image provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.image-name.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Attest image SBOM
        if: github.event_name != 'pull_request'
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ steps.image-name.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: image.spdx.json
          push-to-registry: true

      # GHCR takes its description from the Dockerfile's OCI labels. Docker Hub
      # does not — it needs an API call, so the page sat empty through 2,177
      # pulls. Synced on a release rather than by hand, for the same reason as the
      # Artifact Hub metadata: a manual step nobody owns does not get done.
      #
      # continue-on-error because this is a listing nicety and the release is not.
      # On v0.2.2 it returned "Forbidden" and took a green release build red with
      # it, after the image and chart had already published correctly — a cosmetic
      # step must never be able to do that. Forbidden means DOCKERHUB_TOKEN cannot
      # edit repository metadata: registry push needs only Read/Write, but this
      # endpoint wants a token with broader account access. Fix the token, not this.
      - name: Sync the Docker Hub description
        if: github.ref_type == 'tag' && steps.dockerhub.outputs.enabled == 'true'
        continue-on-error: true
        id: dockerhub_description
        uses: peter-evans/dockerhub-description@432a30c9e07499fd01da9f8a49f0faf9e0ca5b77 # v4.0.2
        with:
          username: ${{ vars.DOCKERHUB_USERNAME || 'dmarcanalyzernet' }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.DOCKERHUB_IMAGE }}
          short-description: "Open-source, self-hosted DMARC monitoring for agencies — unlimited domains, no per-domain pricing"
          readme-filepath: ./deploy/dockerhub-readme.md

      - name: Note an unsynced Docker Hub description
        if: steps.dockerhub_description.outcome == 'failure'
        run: |
          echo "::warning::Docker Hub description not updated (${{ steps.dockerhub_description.outcome }})."
          echo "::warning::DOCKERHUB_TOKEN likely lacks permission to edit repository metadata. The release itself is unaffected."

  # Publishing is intentionally separate from validation. A release chart must
  # never become visible before its referenced image, smoke test, provenance and
  # SBOM have all completed successfully.
  chart-publish:
    if: github.ref_type == 'tag'
    needs: [chart, image]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Package and push
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          helm package "$CHART_DIR" --version "$version" --app-version "$version" -d dist
          helm push "dist/dmarc-analyzer-${version}.tgz" "$CHART_REGISTRY"
          echo "::notice::Published chart $version to ${CHART_REGISTRY}/dmarc-analyzer"

      - name: Install checksum-verified ORAS
        run: |
          set -euo pipefail
          archive=/tmp/oras.tar.gz
          curl -sSLo "$archive" https://github.com/oras-project/oras/releases/download/v1.3.3/oras_1.3.3_linux_amd64.tar.gz
          echo '9ce999f8d2de03fc03968b29d743077a58783e545e5eaa53917ca177352d0e59  /tmp/oras.tar.gz' | sha256sum -c -
          tar -xzf "$archive" -C /tmp oras

      - name: Push Artifact Hub metadata
        run: |
          set -euo pipefail
          /tmp/oras login ghcr.io -u '${{ github.actor }}' --password-stdin <<< '${{ secrets.GITHUB_TOKEN }}'
          /tmp/oras push "${CHART_REGISTRY#oci://}/dmarc-analyzer:artifacthub.io" \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            deploy/helm/artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml
          echo "::notice::Pushed Artifact Hub metadata for the verified-publisher badge"
